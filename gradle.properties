version=13.2-SNAPSHOT

# Gradle performance optimizations
org.gradle.jvmargs=-Xmx10G -XX:MaxMetaspaceSize=512M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
kotlin.stdlib.default.dependency=false

riderBuildVersion=2024.2
clionBuildVersion=2024.2
intellijBuildType=IC
intellijBuildVersion=2024.2
intellijUltimateBuildVersion=2024.2

# CI integration test IDE versions (bump when JetBrains ships a new stable / EAP)
# Each must match the Linux tarball name on download.jetbrains.com; EAPs are named by build number
minSupportedIdeVersion=2024.2
latestStableIdeVersion=2026.2.4
eapIdeVersion=263.7307.44
# Per-product overrides when JetBrains versions diverge
minRiderIdeVersion=2024.2.7
eapRiderIdeVersion=2026.3-EAP9-263.7307.100.Checked
eapCLionIdeVersion=263.7307.35

# Plugin verifier stable releases (separate from the UI integration-test matrix)
verifierLatestIdeVersion=2026.2.3
verifierCommunityIdeVersion=2025.3
verifierAndroidStudioVersion=2026.2.1.8
verifierRiderIdeVersion=2026.2.3.1
verifierClionIdeVersion=2026.2.4
