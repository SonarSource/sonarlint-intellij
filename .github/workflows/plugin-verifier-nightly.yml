name: Plugin Verifier Nightly

on:
  schedule:
    - cron: '0 0 * * 4'  # Every Thursdays at midnight UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  CACHE_BACKEND: s3

jobs:
  verify_plugin:
    runs-on: sonar-m
    name: Verify Plugin - LATEST
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2025.9.12

      # Cache extracted IDEs and their indices independently of the Gradle version.
      # Refresh snapshots when verifier configuration changes, reusing older caches as a fallback.
      - name: Restore verifier IDEs cache
        uses: SonarSource/gh-action_cache@0b86c7a0e6c3cb8238c826be7dd9fdfd02f16f8b # v1.7.3
        with:
          path: .intellijPlatform/ides
          key: verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-LATEST-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-LATEST-

      - name: Cache Gradle
        uses: SonarSource/gh-action_cache@0b86c7a0e6c3cb8238c826be7dd9fdfd02f16f8b # v1.7.3
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/*/transforms/
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-nightly-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-nightly-
            gradle-${{ runner.os }}-

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@b4eede988476ebb13a242fbc3ae4e8e374d78ad0 # 2.5.1
        with:
          sonar-platform: none
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          disable-caching: 'true'

      # Verifier downloads IDE tarballs through Gradle ivy from jetbrains-download.
      # Edge returns HTTP 404 for that repo; keep this job on SaaS (same as curl IDE fetches).
      - name: Run plugin verifier
        run: ./gradlew :verifyPlugin -PverifierEnv=LATEST

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-reports-latest
          path: "**/reports/**/*"
          if-no-files-found: warn
