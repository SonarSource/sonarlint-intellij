name: Plugin Verifier Nightly

on:
  schedule:
    - cron: '0 0 * * 4'  # Every Thursdays at midnight UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  CACHE_BACKEND: s3

jobs:
  verify_plugin:
    runs-on: sonar-m
    name: Verify Plugin - LATEST
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2025.9.12

      # Cache verifier IDE binaries separately with a stable key (not invalidated by unrelated Gradle changes)
      # IDEs are stored by the IntelliJ Platform Gradle Plugin v2.x in ~/.gradle/caches/<gradle-version>/transforms/
      - name: Restore verifier IDEs cache
        uses: SonarSource/gh-action_cache@0b86c7a0e6c3cb8238c826be7dd9fdfd02f16f8b # v1.7.3
        with:
          path: ~/.gradle/caches/*/transforms/
          key: verifier-ides-${{ runner.os }}-LATEST-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            verifier-ides-${{ runner.os }}-LATEST-
            verifier-ides-${{ runner.os }}-

      - name: Cache Gradle
        uses: SonarSource/gh-action_cache@0b86c7a0e6c3cb8238c826be7dd9fdfd02f16f8b # v1.7.3
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/*/transforms/
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-nightly-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-nightly-
            gradle-${{ runner.os }}-

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@62463382a24f2004ffa20adbe9985f6459e031e6 # 2.3.0
        with:
          sonar-platform: none
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          disable-caching: 'true'

      # Verifier downloads IDE tarballs through Gradle ivy from jetbrains-download.
      # Edge returns HTTP 404 for that repo; keep this job on SaaS (same as curl IDE fetches).
      - name: Run plugin verifier
        run: ./gradlew :verifyPlugin -PverifierEnv=LATEST

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-reports-latest
          path: "**/reports/**/*"
          if-no-files-found: warn
