name: Plugin Verifier Nightly

on:
  schedule:
    - cron: '0 0 * * 4'  # Every Thursdays at midnight UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  CACHE_BACKEND: s3

jobs:
  verify_plugin:
    runs-on: sonar-m
    name: Verify Plugin - FULL
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      # Cache extracted IDEs and their indices independently of the Gradle version.
      # Refresh snapshots when verifier configuration changes, reusing older caches as a fallback.
      - name: Restore verifier IDEs cache
        uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf # v1.7.5
        with:
          path: .intellijPlatform/ides
          key: verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-FULL-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          # Reuse IDE downloads cached before the mode was renamed to FULL.
          restore-keys: |
            verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-FULL-
            verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-LATEST-

      - name: Cache Gradle
        uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf # v1.7.5
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/*/transforms/
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-nightly-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-nightly-
            gradle-${{ runner.os }}-

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@0bcfefcfa58f975805e4c48653a64f633fa414d5 # 1.8.10
        with:
          sonar-platform: none
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          disable-caching: 'true'

      # Verifier downloads IDE tarballs through Gradle ivy from jetbrains-download.
      # Edge returns HTTP 404 for that repo; keep this job on SaaS (same as curl IDE fetches).
      - name: Run plugin verifier
        run: ./gradlew :verifyPlugin -PverifierEnv=FULL

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-reports-full
          path: "**/reports/**/*"
          if-no-files-found: warn
