name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.event.pull_request.base.ref || 'push' }}-
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  checks: write

env:
  CACHE_BACKEND: s3

jobs:
  build-number:
    outputs:
      BUILD_NUMBER: ${{ steps.build-number.outputs.BUILD_NUMBER }}
    runs-on: sonar-xs
    name: Get build number
    permissions:
      id-token: write
    steps:
      - uses: SonarSource/ci-github-actions/get-build-number@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        id: build-number

  aws-auth:
    runs-on: sonar-xs
    permissions:
      id-token: write
    outputs:
      # Note: Output key names are generated by aws-actions/amazon-ecr-login and include the registry URL (with account ID).
      # These cannot be templated due to GitHub Actions limitations.
      docker_username: ${{ steps.login-ecr.outputs.docker_username_275878209202_dkr_ecr_eu_central_1_amazonaws_com }}
      docker_password: ${{ steps.login-ecr.outputs.docker_password_275878209202_dkr_ecr_eu_central_1_amazonaws_com }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::275878209202:role/deploymentroles/DevInfraSquadDockerImagesAccessRole

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'false'

  build-plugin:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    needs:
      - build-number
      - aws-auth
    name: Build Plugin
    outputs:
      PROJECT_VERSION: ${{ steps.set_version.outputs.project-version }}
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      # config-gradle first so we can wait for Edge federation before Gradle resolve.
      # build-gradle then skips its nested config-gradle (CONFIG_GRADLE_COMPLETED).
      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Point resolve at Edge
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/point-resolve-at-edge

      - name: Build Plugin
        uses: SonarSource/ci-github-actions/build-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        id: build_plugin
        with:
          sonar-platform: none
          deploy-pull-request: true
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          gradle-args: -x test -x :its:check :buildPlugin :cyclonedxBom
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Set project version output
        id: set_version
        run: echo "project-version=${PROJECT_VERSION}" >> $GITHUB_OUTPUT

  check_windows:
    runs-on: warp-custom-sonarlint-intellij
    needs: build-number
    name: Test Windows
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          sonar-platform: none
          artifactory-reader-role: private-reader

      - name: Point resolve at Edge
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/point-resolve-at-edge

      - name: Run checks
        env:
          IDEA_HOME: C:\Program Files\intellij
          RIDER_HOME: C:\Program Files\rider
          CLION_HOME: C:\Program Files\clion
          ULTIMATE_HOME: C:\Program Files\ultimate
        run: .\gradlew.bat :check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/test-results/**/*.xml'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-windows
          path: "**/reports/**/**"

      - name: Upload JUnit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-windows
          path: "**/test-results/**/*.xml"

  test-and-sonar:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Tests and Sonar
    needs:
      - build-plugin
      - build-number
      - aws-auth
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Full history needed for Sonar blame

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Point resolve at Edge
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/point-resolve-at-edge

      - name: Run Tests and Sonar Analysis
        uses: SonarSource/ci-github-actions/build-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          deploy: false
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          gradle-args: -x :its:check -x :buildPlugin -x :buildPluginBlockmap -x :cyclonedxBom check jacocoTestReport
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/test-results/**/*.xml'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-linux
          path: "**/reports/**/**"

      - name: Upload JUnit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-linux
          path: "**/test-results/**/*.xml"

  verify-plugin:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Verify Plugin
    needs:
      - build-plugin
      - build-number
      - aws-auth
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      - name: Restore verifier IDEs cache
        uses: SonarSource/gh-action_cache@0b86c7a0e6c3cb8238c826be7dd9fdfd02f16f8b # v1.7.3
        with:
          path: .intellijPlatform/ides
          key: verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-CI-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            verifier-ides-v2-${{ runner.os }}-${{ runner.arch }}-CI-

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          cache-paths: |
            /home/runner/.gradle/caches
            !/home/runner/.gradle/caches/*/transforms/
            /home/runner/.gradle/wrapper

      # Verifier downloads IDE tarballs through Gradle ivy from jetbrains-download.
      # Edge returns HTTP 404 for that repo, and the config-gradle init script strips
      # any ivy host that does not match ARTIFACTORY_URL. Keep this job on SaaS.
      - name: Verify Plugin Compatibility
        uses: SonarSource/ci-github-actions/build-gradle@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          deploy: false
          sonar-platform: none
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          gradle-args: -x test -x check -x :its:check :verifyPlugin
          cache-paths: |
            /home/runner/.gradle/caches
            !/home/runner/.gradle/caches/*/transforms/
            /home/runner/.gradle/wrapper

  test-qa-matrix:
    runs-on: sonar-xs
    name: Test QA matrix selection
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test QA matrix selection
        run: python3 .github/scripts/test_qa_matrix.py

  qa:
    if: github.event_name != 'pull_request'
    needs: build-plugin
    uses: ./.github/workflows/qa-its.yml
    with:
      matrix_mode: pr
      project_version: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}

  promote:
    runs-on: sonar-xs
    name: Promote
    needs:
      - build-number
      - build-plugin
      - test-and-sonar
      - check_windows
      - test-qa-matrix
      - qa
    if: >
      !cancelled() &&
      needs.build-plugin.result == 'success' &&
      needs.test-and-sonar.result == 'success' &&
      needs.check_windows.result == 'success' &&
      needs.test-qa-matrix.result == 'success' &&
      (github.event_name == 'pull_request' ||
       ((needs.qa.result == 'success' || needs.qa.result == 'skipped') &&
        (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-on-'))))
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2025.9.12

      - name: Promote artifacts
        uses: SonarSource/ci-github-actions/promote@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        env:
          PROJECT_VERSION: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
        with:
          promote-pull-request: true

  dogfood:
    runs-on: sonar-xs
    name: Deploy dogfood to JetBrains Marketplace
    needs:
      - build-plugin
      - promote
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/upload-to-jetbrains-marketplace
        with:
          version: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
          channel: dogfood
