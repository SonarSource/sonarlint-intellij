name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.event.pull_request.base.ref || 'push' }}-
    ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  checks: write

env:
  CACHE_BACKEND: s3

jobs:
  build-number:
    outputs:
      BUILD_NUMBER: ${{ steps.build-number.outputs.BUILD_NUMBER }}
    runs-on: sonar-xs
    name: Get build number
    permissions:
      id-token: write
    steps:
      - uses: SonarSource/ci-github-actions/get-build-number@657e44543f55422ffd28b91d62fe5386f07d6030 # 1.6.0
        id: build-number

  aws-auth:
    runs-on: sonar-xs
    permissions:
      id-token: write
    outputs:
      # Note: Output key names are generated by aws-actions/amazon-ecr-login and include the registry URL (with account ID).
      # These cannot be templated due to GitHub Actions limitations.
      docker_username: ${{ steps.login-ecr.outputs.docker_username_275878209202_dkr_ecr_eu_central_1_amazonaws_com }}
      docker_password: ${{ steps.login-ecr.outputs.docker_password_275878209202_dkr_ecr_eu_central_1_amazonaws_com }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::275878209202:role/deploymentroles/DevInfraSquadDockerImagesAccessRole

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5
        with:
          mask-password: 'false'

  build-plugin:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    needs:
      - build-number
      - aws-auth
    name: Build Plugin
    outputs:
      PROJECT_VERSION: ${{ steps.set_version.outputs.project-version }}
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      - name: Build Plugin
        uses: SonarSource/ci-github-actions/build-gradle@1df8fda46f8e82cfdd17b6a8e16a199282988b4f # 1.8.8
        id: build_plugin
        with:
          sonar-platform: none
          deploy-pull-request: true
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          gradle-args: -x test -x :its:check :buildPlugin :cyclonedxBom
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Set project version output
        id: set_version
        run: echo "project-version=${PROJECT_VERSION}" >> $GITHUB_OUTPUT

  check_windows:
    runs-on: warp-custom-sonarlint-intellij
    needs: build-number
    name: Test Windows
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2025.9.12

      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@1df8fda46f8e82cfdd17b6a8e16a199282988b4f # 1.8.8
        with:
          sonar-platform: none
          artifactory-reader-role: private-reader

      - name: Run checks
        env:
          IDEA_HOME: C:\Program Files\intellij
          RIDER_HOME: C:\Program Files\rider
          CLION_HOME: C:\Program Files\clion
          ULTIMATE_HOME: C:\Program Files\ultimate
        run: .\gradlew.bat :check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/test-results/**/*.xml'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-windows
          path: "**/reports/**/**"

      - name: Upload JUnit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-windows
          path: "**/test-results/**/*.xml"

  test-and-sonar:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Tests and Sonar
    needs:
      - build-plugin
      - build-number
      - aws-auth
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history needed for Sonar blame

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      - name: Run Tests and Sonar Analysis
        uses: SonarSource/ci-github-actions/build-gradle@1df8fda46f8e82cfdd17b6a8e16a199282988b4f # 1.8.8
        with:
          deploy: false
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          gradle-args: -x :its:check -x :buildPlugin -x :buildPluginBlockmap -x :cyclonedxBom check jacocoTestReport
          cache-paths: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/test-results/**/*.xml'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-linux
          path: "**/reports/**/**"

      - name: Upload JUnit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-linux
          path: "**/test-results/**/*.xml"

  verify-plugin:
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Verify Plugin
    needs:
      - build-plugin
      - build-number
      - aws-auth
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2025.9.12

      - name: Export embedded IDE paths from container
        run: |
          echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
          echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
          echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
          echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

      - name: Restore verifier IDEs cache
        uses: SonarSource/gh-action_cache@0666e03d7b6480758214db522a3aac989d67b026 # v1.7.0
        with:
          path: /home/runner/.gradle/caches/*/transforms/
          key: verifier-ides-${{ runner.os }}-IC-2025.2-IC-242
          restore-keys: |
            verifier-ides-${{ runner.os }}-

      - name: Verify Plugin Compatibility
        uses: SonarSource/ci-github-actions/build-gradle@1df8fda46f8e82cfdd17b6a8e16a199282988b4f # 1.8.8
        with:
          deploy: false
          sonar-platform: none
          use-develocity: true
          develocity-url: https://develocity.sonar.build
          artifactory-reader-role: private-reader
          gradle-args: -x test -x check -x :its:check :verifyPlugin -PverifierEnv=CI
          cache-paths: |
            /home/runner/.gradle/caches
            !/home/runner/.gradle/caches/*/transforms/
            /home/runner/.gradle/wrapper

  setup-qa-matrix:
    runs-on: sonar-xs
    name: Setup QA matrix
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      skip_its: ${{ steps.set-matrix.outputs.skip_its }}
      rider_matrix: ${{ steps.set-matrix.outputs.rider_matrix }}
      has_rider: ${{ steps.set-matrix.outputs.has_rider }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build PR QA matrix
        id: set-matrix
        run: .github/scripts/qa-matrix.sh pr

  qa:
    if: needs.setup-qa-matrix.outputs.skip_its != 'true'
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Run ITs - ${{ matrix.ide_version }} - ${{ matrix.test_suite || matrix.qa_category }}
    needs:
      - build-plugin
      - build-number
      - aws-auth
      - setup-qa-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-qa-matrix.outputs.matrix) }}
    env:
      DISPLAY: ':10'
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/run-qa-its
        with:
          ide_version: ${{ matrix.ide_version }}
          qa_category: ${{ matrix.qa_category }}
          project_version: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
          test_suite: ${{ matrix.test_suite }}

  # Rider C# analysis ITs still time out waiting for findings (the reason this
  # flavor was disabled in Dec 2025). Keep the job for signal, but do not let
  # it fail `qa` or block Promote on PRs. Master pushes still fail the workflow
  # so notify-failure.yml can alert Slack. Nightly/EAP also gate on Rider.
  qa-rider:
    if: needs.setup-qa-matrix.outputs.has_rider == 'true'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: warp-custom-ubuntu-24-04
    container:
      image: 275878209202.dkr.ecr.eu-central-1.amazonaws.com/sonarlint-intellij:20260410161051
      options: --user runner
      credentials:
        username: ${{ needs.aws-auth.outputs.docker_username }}
        password: ${{ needs.aws-auth.outputs.docker_password }}
    defaults:
      run:
        shell: bash
    name: Run ITs - ${{ matrix.ide_version }} - ${{ matrix.test_suite || matrix.qa_category }}
    needs:
      - build-plugin
      - build-number
      - aws-auth
      - setup-qa-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-qa-matrix.outputs.rider_matrix) }}
    env:
      DISPLAY: ':10'
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/run-qa-its
        with:
          ide_version: ${{ matrix.ide_version }}
          qa_category: ${{ matrix.qa_category }}
          project_version: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
          test_suite: ${{ matrix.test_suite }}

  promote:
    runs-on: sonar-xs
    name: Promote
    needs:
      - build-number
      - build-plugin
      - test-and-sonar
      - check_windows
      - setup-qa-matrix
      - qa
    if: >
      !cancelled() &&
      needs.build-plugin.result == 'success' &&
      needs.test-and-sonar.result == 'success' &&
      needs.check_windows.result == 'success' &&
      needs.setup-qa-matrix.result == 'success' &&
      (needs.qa.result == 'success' ||
       (needs.qa.result == 'skipped' && needs.setup-qa-matrix.outputs.skip_its == 'true')) &&
      (github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-on-'))
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2025.9.12

      - name: Promote artifacts
        uses: SonarSource/ci-github-actions/promote@657e44543f55422ffd28b91d62fe5386f07d6030 # 1.6.0
        env:
          PROJECT_VERSION: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
        with:
          promote-pull-request: true

  dogfood:
    runs-on: sonar-xs
    name: Deploy dogfood to JetBrains Marketplace
    needs:
      - build-plugin
      - promote
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/upload-to-jetbrains-marketplace
        with:
          version: ${{ needs.build-plugin.outputs.PROJECT_VERSION }}
          channel: dogfood
