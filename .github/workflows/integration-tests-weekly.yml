name: Integration Tests Weekly

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays at 02:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  qa:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/qa-its.yml
    with:
      matrix_mode: weekly
