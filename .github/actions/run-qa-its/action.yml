name: Run QA Integration Tests
description: Setup IDE, start Remote Robot, and run SonarQube for IntelliJ UI integration tests

inputs:
  ide_version:
    description: IDE identifier (e.g. IC-2025.3.2, CL-2024.2)
    required: true
  qa_category:
    description: Label for artifacts and job naming
    required: true
  project_version:
    description: Built plugin version to download from Artifactory QA repo
    required: true
  test_suite:
    description: Optional JUnit tag (OpenInIdeTests, ConnectedAnalysisTests, ConfigurationTests, Standalone)
    required: false
    default: ''
  plugin_zip_path:
    description: Optional local plugin zip; skips the Artifactory QA download when set
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        version: 2025.9.12

    - name: Configure Gradle
      uses: SonarSource/ci-github-actions/config-gradle@1df8fda46f8e82cfdd17b6a8e16a199282988b4f # 1.8.8
      with:
        sonar-platform: none
        use-develocity: true
        develocity-url: https://develocity.sonar.build
        artifactory-reader-role: private-reader
        disable-caching: 'true'

    - name: Select Java 21
      shell: bash
      run: mise use java@21

    - name: Vault Secrets
      id: secrets
      uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
      with:
        secrets: |
          development/team/sonarlint/kv/data/ide.keys clion | CLION_KEY;
          development/team/sonarlint/kv/data/ide.keys goland | GOLAND_KEY;
          development/team/sonarlint/kv/data/ide.keys idea | IDEA_KEY;
          development/team/sonarlint/kv/data/ide.keys phpstorm | PHPSTORM_KEY;
          development/team/sonarlint/kv/data/ide.keys pycharm | PYCHARM_KEY;
          development/team/sonarlint/kv/data/ide.keys rider | RIDER_KEY;
          development/github/token/licenses-ro token | GITHUB_TOKEN;
          development/team/sonarlint/kv/data/sonarcloud-it token | SONARCLOUD_IT_TOKEN;

    - name: Compute month key
      id: month
      shell: bash
      run: |
        THIS_MONTH="$(date +%Y-%m)"
        echo "month=${THIS_MONTH}" >> "$GITHUB_OUTPUT"
        ORCHESTRATOR_HOME="${GITHUB_WORKSPACE}/orchestrator/${THIS_MONTH}"
        echo "ORCHESTRATOR_HOME=${ORCHESTRATOR_HOME}" >> "$GITHUB_ENV"
        mkdir -p "${ORCHESTRATOR_HOME}"

    - uses: SonarSource/gh-action_cache@0666e03d7b6480758214db522a3aac989d67b026 # v1.7.0
      with:
        path: ${{ github.workspace }}/orchestrator/${{ steps.month.outputs.month }}
        key: cache-${{ runner.os }}-${{ steps.month.outputs.month }}
        restore-keys: |
          cache-${{ runner.os }}

    - name: Generate Gradle Cache Key
      id: gradle-cache-key
      shell: bash
      run: |
        /usr/bin/find . \( -name '*.gradle' -o -name '*.gradle.kts' \) -type f -exec md5sum {} \; | sort > gradle-md5-sums.txt
        md5sum gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties 2>/dev/null >> gradle-md5-sums.txt || true
        GRADLE_CACHE_KEY=$(md5sum gradle-md5-sums.txt | awk '{ print $1 }')
        echo "key=${GRADLE_CACHE_KEY}" >> "$GITHUB_OUTPUT"
        rm -f gradle-md5-sums.txt

    - name: Restore Gradle Cache
      uses: SonarSource/gh-action_cache@0666e03d7b6480758214db522a3aac989d67b026 # v1.7.0
      with:
        path: |
          /home/runner/.gradle/caches
          /home/runner/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ github.workflow }}-${{ steps.gradle-cache-key.outputs.key }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ github.workflow }}-

    - name: Start Xvfb
      shell: bash
      env:
        DISPLAY: ':10'
      run: |
        Xvfb ${DISPLAY} -screen 0 1280x960x24 &
        echo "XVFB_PID=$!" >> $GITHUB_ENV
        sleep 2

    - name: Export embedded IDE paths from container
      shell: bash
      run: |
        echo "IDEA_HOME=${IDEA_2024_DIR}" >> $GITHUB_ENV
        echo "CLION_HOME=${CLION_2024_DIR}" >> $GITHUB_ENV
        echo "RIDER_HOME=${RIDER_2024_DIR}" >> $GITHUB_ENV
        echo "ULTIMATE_HOME=${IDEA_ULTIMATE_2024_DIR}" >> $GITHUB_ENV

    - name: Determine IDE source (embedded vs Repox)
      id: ide-source
      shell: bash
      env:
        IDE: ${{ inputs.ide_version }}
      run: |
        IDE_CODE="${IDE%%-*}"
        IDE_VERSION="${IDE#*-}"
        IDE_YEAR="${IDE_VERSION%%.*}"

        EMBEDDED="false"
        CACHE_PATH=""

        case "$IDE_CODE-$IDE_YEAR" in
          IC-2024|IU-2024|CL-2024|RD-2024)
            EMBEDDED="true"
            ;;
          *)
            case "$IDE_CODE" in
              IC) CACHE_PATH="$HOME/.cache/JetBrains/IdeaIC/$IDE_VERSION" ;;
              IU) CACHE_PATH="$HOME/.cache/JetBrains/IdeaIU/$IDE_VERSION" ;;
              CL) CACHE_PATH="$HOME/.cache/JetBrains/CLion/$IDE_VERSION" ;;
              RD) CACHE_PATH="$HOME/.cache/JetBrains/Rider/$IDE_VERSION" ;;
              PY) CACHE_PATH="$HOME/.cache/JetBrains/PyCharm/$IDE_VERSION" ;;
              PC) CACHE_PATH="$HOME/.cache/JetBrains/PyCharmCE/$IDE_VERSION" ;;
              PS) CACHE_PATH="$HOME/.cache/JetBrains/PhpStorm/$IDE_VERSION" ;;
              GO) CACHE_PATH="$HOME/.cache/JetBrains/GoLand/$IDE_VERSION" ;;
            esac
            ;;
        esac

        echo "embedded=$EMBEDDED" >> $GITHUB_OUTPUT
        echo "cache_path=$CACHE_PATH" >> $GITHUB_OUTPUT
        echo "IDE: $IDE (code=$IDE_CODE, version=$IDE_VERSION, year=$IDE_YEAR, embedded=$EMBEDDED)"

    - name: Restore IDE from cache
      if: steps.ide-source.outputs.embedded == 'false'
      uses: SonarSource/gh-action_cache@0666e03d7b6480758214db522a3aac989d67b026 # v1.7.0
      with:
        path: ${{ steps.ide-source.outputs.cache_path }}
        key: ${{ runner.os }}-jetbrains-ide-${{ inputs.ide_version }}
        restore-keys: |
          ${{ runner.os }}-jetbrains-ide-${{ inputs.ide_version }}-

    - name: Setup IDE for QA test
      shell: bash
      run: .github/scripts/setup-qa-ide.sh "${{ inputs.ide_version }}"

    - name: Validate IDE setup for ${{ inputs.ide_version }}
      shell: bash
      env:
        IDEA_VERSION: ${{ inputs.ide_version }}
      run: |
        IDE_CODE="${IDEA_VERSION%%-*}"
        case "$IDE_CODE" in
          IC|IU) IDE_VAR="IDEA_HOME" ;;
          CL) IDE_VAR="CLION_HOME" ;;
          RD) IDE_VAR="RIDER_HOME" ;;
          PY|PC) IDE_VAR="PYCHARM_HOME" ;;
          PS) IDE_VAR="PHPSTORM_HOME" ;;
          GO) IDE_VAR="GOLAND_HOME" ;;
          *) echo "::error::Unknown IDE code: $IDE_CODE"; exit 1 ;;
        esac
        if [ -z "${!IDE_VAR:-}" ]; then
          echo "::error::${IDE_VAR} is not defined or is empty"
          exit 1
        fi
        IDE_PATH="${!IDE_VAR}"
        if [ ! -d "${IDE_PATH}" ] || [ -z "$(ls -A "${IDE_PATH}" 2>/dev/null)" ]; then
          echo "::error::IDE path missing or empty: ${IDE_PATH}"
          exit 1
        fi
        echo "IDE validation successful: ${IDE_VAR}=${IDE_PATH}"

    - name: Extract and setup plugin
      shell: bash
      env:
        PROJECT_VERSION: ${{ inputs.project_version }}
        IDEA_VERSION: ${{ inputs.ide_version }}
        PLUGIN_ZIP_PATH: ${{ inputs.plugin_zip_path }}
        CLION_KEY: ${{ fromJSON(steps.secrets.outputs.vault).CLION_KEY }}
        GOLAND_KEY: ${{ fromJSON(steps.secrets.outputs.vault).GOLAND_KEY }}
        IDEA_KEY: ${{ fromJSON(steps.secrets.outputs.vault).IDEA_KEY }}
        PHPSTORM_KEY: ${{ fromJSON(steps.secrets.outputs.vault).PHPSTORM_KEY }}
        PYCHARM_KEY: ${{ fromJSON(steps.secrets.outputs.vault).PYCHARM_KEY }}
        RIDER_KEY: ${{ fromJSON(steps.secrets.outputs.vault).RIDER_KEY }}
      run: |
        if [ -n "${PLUGIN_ZIP_PATH}" ]; then
          echo "Using local plugin zip: ${PLUGIN_ZIP_PATH}"
          unzip -qo "${PLUGIN_ZIP_PATH}" -d ${GITHUB_WORKSPACE}/downloaded-plugin
        else
          echo "Using project version: ${PROJECT_VERSION}"
          curl -fsSL -u "${ARTIFACTORY_USERNAME}:${ARTIFACTORY_ACCESS_TOKEN}" \
            -o sonarlint-intellij.zip \
            "${ARTIFACTORY_URL}/sonarsource-public-qa/org/sonarsource/sonarlint/intellij/sonarlint-intellij/${PROJECT_VERSION}/sonarlint-intellij-${PROJECT_VERSION}.zip"
          unzip sonarlint-intellij.zip -d ${GITHUB_WORKSPACE}/downloaded-plugin
          rm sonarlint-intellij.zip
        fi
        mv downloaded-plugin/sonarlint-intellij downloaded-plugin/staged-plugin

        IDE_CODE="${IDEA_VERSION%%-*}"
        case "$IDE_CODE" in
          IC|IU) IDE_HOME="$IDEA_HOME" ;;
          CL)    IDE_HOME="$CLION_HOME" ;;
          RD)    IDE_HOME="$RIDER_HOME" ;;
          PY|PC) IDE_HOME="$PYCHARM_HOME" ;;
          PS)    IDE_HOME="$PHPSTORM_HOME" ;;
          GO)    IDE_HOME="$GOLAND_HOME" ;;
          *) echo "::error::Unknown IDE code: $IDE_CODE"; exit 1 ;;
        esac
        PRODUCT_CODE=$(jq -r .productCode "${IDE_HOME}/product-info.json")
        PRODUCT_VERSION=$(jq -r .version "${IDE_HOME}/product-info.json")
        SANDBOX_CONFIG_DIR=".intellijPlatform/sandbox/its/${PRODUCT_CODE}-${PRODUCT_VERSION}/config_runIdeForUiTests"
        mkdir -p "${SANDBOX_CONFIG_DIR}"

        case "$IDE_CODE" in
          IC|PC) KEY_VAR=""             ; KEY_FILE="" ;;
          IU)    KEY_VAR="IDEA_KEY"     ; KEY_FILE="idea.key" ;;
          CL)    KEY_VAR="CLION_KEY"    ; KEY_FILE="clion.key" ;;
          RD)    KEY_VAR="RIDER_KEY"    ; KEY_FILE="rider.key" ;;
          PY)    KEY_VAR="PYCHARM_KEY"  ; KEY_FILE="pycharm.key" ;;
          PS)    KEY_VAR="PHPSTORM_KEY" ; KEY_FILE="phpstorm.key" ;;
          GO)    KEY_VAR="GOLAND_KEY"   ; KEY_FILE="goland.key" ;;
        esac
        if [ -n "$KEY_VAR" ]; then
          echo "Writing license key to ${SANDBOX_CONFIG_DIR}/${KEY_FILE}"
          echo "${!KEY_VAR}" | base64 -d > "${SANDBOX_CONFIG_DIR}/${KEY_FILE}"
        else
          echo "No license key required for $IDE_CODE"
        fi

        metacity --sm-disable --replace &
        sleep 3

    - name: Start IDE in background
      shell: bash
      env:
        IDEA_VERSION: ${{ inputs.ide_version }}
      run: |
        nohup ./gradlew :its:runIdeForUiTests --stacktrace -i \
          -PijVersion=${IDEA_VERSION} \
          -PslPluginDirectory=${GITHUB_WORKSPACE}/downloaded-plugin > ${GITHUB_WORKSPACE}/runIdeGradle.log 2>&1 &
        echo "IDE_PID=$!" >> $GITHUB_ENV

    - name: Wait for IDE to start
      shell: bash
      run: |
        echo "Waiting for IDE to start..."
        curl --retry 150 \
             --retry-delay 5 \
             --retry-all-errors \
             --fail \
             --max-time 3 \
             --connect-timeout 2 \
             --silent \
             --output /dev/null \
             http://127.0.0.1:8082 2>/dev/null && echo "IDE is ready!" || (echo "Timeout waiting for IDE to start" && exit 1)

    - name: Start recording
      shell: bash
      env:
        DISPLAY: ':10'
        IDEA_VERSION: ${{ inputs.ide_version }}
      run: |
        echo 'Recording tests on video'
        ffmpeg -loglevel warning -f x11grab -video_size 1280x960 -i ${DISPLAY} \
          -codec:v libx264 -r 12 ${GITHUB_WORKSPACE}/recording_${IDEA_VERSION}.mp4 &
        echo "FFMPEG_PID=$!" >> $GITHUB_ENV

    - name: Configure Maven
      uses: SonarSource/ci-github-actions/config-maven@71df716ff4caba2dbb7cd08a5f6fb932503602fc # 1.7.2
      with:
        artifactory-reader-role: private-reader

    - name: Run integration tests
      shell: bash
      env:
        SONARCLOUD_IT_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARCLOUD_IT_TOKEN }}
        GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        IDEA_VERSION: ${{ inputs.ide_version }}
        TEST_SUITE: ${{ inputs.test_suite }}
      run: ./gradlew :its:check --stacktrace -i -PijVersion=${IDEA_VERSION} -PslPluginDirectory=${GITHUB_WORKSPACE}/downloaded-plugin --rerun-tasks

    - name: Stop recording
      if: always()
      shell: bash
      run: |
        if [ -n "${FFMPEG_PID:-}" ] && kill -0 $FFMPEG_PID 2>/dev/null; then
          kill -2 $FFMPEG_PID
          timeout=30
          while kill -0 $FFMPEG_PID 2>/dev/null && [ $timeout -gt 0 ]; do
            sleep 1
            timeout=$((timeout - 1))
          done
        fi
        if [ -n "${XVFB_PID:-}" ] && kill -0 $XVFB_PID 2>/dev/null; then
          kill $XVFB_PID
        fi

    - name: Display IDE log
      if: always()
      shell: bash
      run: |
        if [ -f ${GITHUB_WORKSPACE}/runIdeGradle.log ]; then
          cat ${GITHUB_WORKSPACE}/runIdeGradle.log
        fi

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
      if: ${{ !cancelled() }}
      with:
        report_paths: '**/test-results/**/*.xml'

    - name: Upload test recording
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-recording-${{ inputs.ide_version }}-${{ inputs.test_suite || inputs.qa_category }}
        path: ${{ github.workspace }}/recording_${{ inputs.ide_version }}.mp4
        if-no-files-found: warn

    - name: Upload test reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports-qa-${{ inputs.ide_version }}-${{ inputs.test_suite || inputs.qa_category }}
        path: "**/reports/**/*"
        if-no-files-found: warn

    - name: Upload JUnit test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-results-qa-${{ inputs.ide_version }}-${{ inputs.test_suite || inputs.qa_category }}
        path: "**/test-results/**/*.xml"
