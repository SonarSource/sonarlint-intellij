// Apply common logic to all module build files

apply(from: "${rootProject.projectDir}/gradle/intellij-dependency-lock.gradle")

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // IntelliJ Platform plugin reassembles Test.classpath from its own configurations,
    // independently of sourceSets. Filter at execution so CLion's lib/junit5.jar cannot
    // shadow catalog JUnit 6 at runtime.
    doFirst {
        classpath = classpath.filter { it.name != 'junit5.jar' }
    }
}

// CLion 2024.2 ships lib/junit5.jar (JUnit 5, no JSpecify) on the platform classpath,
// ahead of the catalog junit-jupiter-api 6.1.1. Drop it so every module compiles against
// JUnit 6. Gradle cannot exclude that jar as a Maven coordinate.
pluginManager.withPlugin("java") {
    sourceSets.test {
        compileClasspath = compileClasspath.filter { it.name != 'junit5.jar' }
        runtimeClasspath = runtimeClasspath.filter { it.name != 'junit5.jar' }
    }
}

tasks.matching { it.name == "signArchives" }.configureEach {
  dependsOn(":composedJar")
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

kotlin {
    jvmToolchain(21)
}

tasks {
  cyclonedxDirectBom {
    includeConfigs = ["runtimeClasspath"]
    xmlOutput.unsetConvention()
  }
}

license {
    header = rootProject.file("HEADER")
    mapping(
      Map.of(
        "java", "SLASHSTAR_STYLE",
        "kt", "SLASHSTAR_STYLE",
        "svg", "XML_STYLE",
        "form", "XML_STYLE"
      )
    )
    excludes(List.of("**/*.jar", "**/*.png", "**/README"))
    strictCheck = true
}
